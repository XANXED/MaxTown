name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: install, typecheck, database tests, build, Render contract, Docker, Compose smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maxtown
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: maxtown
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maxtown -d maxtown"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Apply database migrations
        run: npm run db:migrate --workspace=@maxtown/api
        env:
          DATABASE_URL: postgres://maxtown:ci-only-password@localhost:5432/maxtown

      - name: Run tests, including Render Blueprint contract
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://maxtown:ci-only-password@localhost:5432/maxtown

      - name: Build production workspaces
        run: npm run build

      - name: Smoke-test project knowledge MCP
        run: npm run smoke:mcp

      - name: Build combined API and frontend image
        run: docker build --file apps/api/Dockerfile --tag maxtown-api:ci .

      - name: Validate deployment shell scripts
        run: bash -n deploy/compose-smoke.sh deploy/smoke.sh deploy/deploy.sh

      - name: Validate Timeweb production Compose model
        run: docker compose --file compose.yml --file compose.prod.yml config --quiet
        env:
          DOMAIN: maxtown.example.com
          POSTGRES_DB: maxtown
          POSTGRES_USER: maxtown
          POSTGRES_PASSWORD: ci-only-password
          COMPOSE_DATABASE_URL: postgres://maxtown:ci-only-password@postgres:5432/maxtown
          BOT_TOKEN: ci-only-bot-token
          MAX_WEBHOOK_SECRET: ci-only-webhook-secret
          DADATA_API_KEY: ci-only-dadata-key
          MODERATOR_USERNAME: ci
          MODERATOR_PASSWORD_HASH: ci-only-not-a-usable-hash
          POLL_VOTER_NULLIFIER_SECRET: ci-only-poll-voter-nullifier-secret-32-bytes

      - name: Clean-volume Compose deployment smoke
        run: ./deploy/compose-smoke.sh maxtown-api:ci
