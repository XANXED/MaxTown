services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 1m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  web:
    image: ${WEB_IMAGE:-maxtown-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgres://maxtown:change-me@postgres:5432/maxtown}
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN}
      MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-t25_hakaton_max_bot}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:?set MAX_WEBHOOK_SECRET}
      MAXTOWN_INTERNAL_SECRET: ${MAXTOWN_INTERNAL_SECRET:-}
      MAXTOWN_PUBLIC_URL: ${MAXTOWN_PUBLIC_URL:-}
      DADATA_API_KEY: ${DADATA_API_KEY:?set DADATA_API_KEY}
      DGIS_API_KEY: ${DGIS_API_KEY:-}
      MODERATOR_USERNAME: ${MODERATOR_USERNAME:?set MODERATOR_USERNAME}
      MODERATOR_PASSWORD_HASH: ${MODERATOR_PASSWORD_HASH:?set MODERATOR_PASSWORD_HASH to a bcrypt hash}
      POLL_VOTER_NULLIFIER_SECRET: ${POLL_VOTER_NULLIFIER_SECRET:?set POLL_VOTER_NULLIFIER_SECRET to at least 32 random bytes}
    ports:
      - "${WEB_PUBLISH:-127.0.0.1:3000:3000}"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database, public]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 15s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  postgres-data:

networks:
  database:
    internal: true
  public: {}
