services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 1m

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE to the combined API image}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      VK_APP_ID: ${VK_APP_ID:?set VK_APP_ID}
      VK_APP_SECRET: ${VK_APP_SECRET:?set VK_APP_SECRET}
      VK_GROUP_ID: ${VK_GROUP_ID:?set VK_GROUP_ID}
      VK_GROUP_TOKEN: ${VK_GROUP_TOKEN:?set VK_GROUP_TOKEN}
      VK_CALLBACK_SECRET: ${VK_CALLBACK_SECRET:?set VK_CALLBACK_SECRET}
      VK_CALLBACK_CONFIRMATION_CODE: ${VK_CALLBACK_CONFIRMATION_CODE:?set VK_CALLBACK_CONFIRMATION_CODE}
      VK_API_VERSION: ${VK_API_VERSION:-5.199}
      MODERATOR_USERNAME: ${MODERATOR_USERNAME:?set MODERATOR_USERNAME}
      MODERATOR_PASSWORD_HASH: ${MODERATOR_PASSWORD_HASH:?set MODERATOR_PASSWORD_HASH to a bcrypt hash}
      POLL_VOTER_NULLIFIER_SECRET: ${POLL_VOTER_NULLIFIER_SECRET:?set POLL_VOTER_NULLIFIER_SECRET to at least 32 random bytes}
    ports:
      - "${WEB_PUBLISH:-127.0.0.1:3000:3000}"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database, public]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 15s
    stop_grace_period: 30s

volumes:
  postgres-data:

networks:
  database:
    internal: true
  public: {}
