services:
  - type: web
    name: maxtown
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /api/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: MODERATOR_USERNAME
        value: moderator
      - key: VK_APP_ID
        sync: false
      - key: VK_APP_SECRET
        sync: false
      - key: VK_GROUP_ID
        sync: false
      - key: VK_GROUP_TOKEN
        sync: false
      - key: VK_CALLBACK_SECRET
        sync: false
      - key: VK_CALLBACK_CONFIRMATION_CODE
        sync: false
      - key: VK_API_VERSION
        value: 5.199
      - key: MODERATOR_PASSWORD_HASH
        sync: false
      - key: POLL_VOTER_NULLIFIER_SECRET
        sync: false
      # Ключ 2ГИС: серверный — для Ближайших мест, VITE_ — для карты в мини-аппе.
      # Запросы 2ГИС с иностранного IP не проходят (docs/adr/0003).
      - key: DGIS_API_KEY
        sync: false
      - key: VITE_DGIS_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: maxtown-db
          property: connectionString

databases:
  - name: maxtown-db
    databaseName: maxtown
    user: maxtown
    plan: free
    region: frankfurt
    postgresMajorVersion: '16'
