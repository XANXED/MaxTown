services:
  - type: web
    name: maxtown
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /api/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: MODERATOR_USERNAME
        value: moderator
      # Бот MAX: токен, секрет webhook, секрет подписки (/api/max/register).
      - key: BOT_TOKEN
        sync: false
      - key: MAX_BOT_USERNAME
        value: t25_hakaton_max_bot
      - key: MAX_WEBHOOK_SECRET
        sync: false
      - key: MAXTOWN_INTERNAL_SECRET
        sync: false
      # Публичный адрес, который знает MAX (Cloudflare Worker, apps/edge).
      - key: MAXTOWN_PUBLIC_URL
        value: https://maxtown.maxtown-bot.workers.dev
      # Адрес Дома по названию Домового чата (ГАР).
      - key: DADATA_API_KEY
        sync: false
      - key: MODERATOR_PASSWORD_HASH
        sync: false
      - key: POLL_VOTER_NULLIFIER_SECRET
        sync: false
      # Ключ 2ГИС: серверный — для Ближайших мест, VITE_ — для карты в мини-аппе.
      # Запросы 2ГИС с иностранного IP не проходят (docs/adr/0008).
      - key: DGIS_API_KEY
        sync: false
      - key: VITE_DGIS_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: maxtown-db
          property: connectionString

databases:
  - name: maxtown-db
    databaseName: maxtown
    user: maxtown
    plan: free
    region: frankfurt
    postgresMajorVersion: '16'
