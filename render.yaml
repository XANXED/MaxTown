services:
  - type: web
    name: maxtown
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /api/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: MODERATOR_USERNAME
        value: moderator
      - key: BOT_TOKEN
        sync: false
      - key: MODERATOR_PASSWORD_HASH
        sync: false
      - key: POLL_VOTER_NULLIFIER_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: maxtown-db
          property: connectionString

databases:
  - name: maxtown-db
    databaseName: maxtown
    user: maxtown
    plan: free
    region: frankfurt
    postgresMajorVersion: '16'
